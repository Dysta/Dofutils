[project]
name = "Dofutils"
version = "0.0.5"
description = "Collection of useful things to build Dofus Retro bot or emulator"
readme = "README.md"
requires-python = ">=3.11, <4.0"
authors = [{ name = "Dysta" }]
keywords = [
  "bot",
  "dofus",
  "dofus retro",
  "emulateur",
  "retro",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/Dysta/Dofutils"

[dependency-groups]
dev = [
  "Sphinx>=7.0.1,<8",
  "mypy>=1.3.0,<2",
  "ruff>=0.16.1",
  "sphinx-material>=0.0.35,<0.0.36",
  "taskipy>=1.11.0,<2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["tests", ".tools"]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.taskipy.tasks]
check = { cmd = "python -m mypy . --exclude '^tests/'", help = "type check the lib with mypy" }
clean = { cmd = "ruff check . --fix --unsafe-fixes", help = "remove unused code/imports and sort imports" }
format = { cmd = "ruff format .", help = "format code" }
test = { cmd = "python -m unittest discover -v", help = "run all the tests" }

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-exclude = [
  "tests",
  "tests.*",
]
wheel-exclude = [
  "tests",
  "tests.*",
]
